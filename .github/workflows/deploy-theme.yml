name: Deploy WordPress theme

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horn-free-theme-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install validation and deployment tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep rsync
      - name: Validate production theme
        run: sh scripts/validate-theme.sh
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.WP_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "Required SSH secrets are missing." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy theme files
        env:
          SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_THEME_PATH: ${{ secrets.WP_THEME_PATH }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$WP_THEME_PATH" ]; then
            echo "Required production deployment secrets are missing." >&2
            exit 1
          fi
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi
          case "$WP_THEME_PATH" in
            */wp-content/themes/horn-free-theme) ;;
            *) echo "WP_THEME_PATH must end with /wp-content/themes/horn-free-theme" >&2; exit 1 ;;
          esac
          rsync -az --delete \
            -e "ssh -p $SSH_PORT" \
            --exclude='.DS_Store' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            Wordpress/horn-free-theme/ \
            "$SSH_USER@$SSH_HOST:$WP_THEME_PATH/"
